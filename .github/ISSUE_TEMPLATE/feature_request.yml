name: Feature request
description: Suggest an improvement for OpenNotebookLM
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Explain the user problem first so the best solution remains open for discussion.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a matching request.
          required: true
        - label: This request describes one focused problem or capability.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what makes it difficult today?
      placeholder: When I ..., I need ..., because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like OpenNotebookLM to provide.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you tried or considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, links, or implementation notes that would help evaluate the request.
