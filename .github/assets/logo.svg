<!--
  The product mark for the README hero: the component's own geometry, at the size
  a hero image is read, rather than the favicon's heavier redraw. The gradient
  repeats the primary and accent tokens as literal hex, because a README is
  rendered on GitHub and never sees the theme's custom properties.

  Keep custom-property names out of this comment. A double hyphen is illegal
  inside an XML comment, which makes the whole file undecodable as an image.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" role="img" aria-label="OpenNotebookLM">
  <defs>
    <linearGradient id="logo-gradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#9b51e0"/>
    </linearGradient>
  </defs>

  <rect width="24" height="24" rx="6" fill="url(#logo-gradient)"/>

  <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.25" y="4.5" width="11.5" height="15" rx="2"/>
    <path d="M9 8.5h6M9 11h4"/>
    <path d="M9.75 14.25h4.5M14.25 14.25 12 17"/>
  </g>

  <g fill="#ffffff">
    <circle cx="9.75" cy="14.25" r="1.15"/>
    <circle cx="14.25" cy="14.25" r="1.15"/>
    <circle cx="12" cy="17" r="1.15"/>
  </g>
</svg>
