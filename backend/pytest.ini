[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Run async tests without decorating each one. There were none when this file
# was added; the mode is set so new ones do not silently no-op.
asyncio_mode = auto

markers =
    eval: retrieval-quality evaluation; needs the network and the ML stack

filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
