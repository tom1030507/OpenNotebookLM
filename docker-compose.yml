version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opennotebook-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_PORT=8000
      - DB_PATH=/app/data/opennotebook.db
      - EMB_BACKEND=sqlitevec
      # sentence-transformers caches downloaded models under $HOME/.cache/torch,
      # which lives in the container's writable layer — recreating the container
      # would re-download gigabytes. Point it at the mounted models volume.
      - SENTENCE_TRANSFORMERS_HOME=/app/models
      - HF_HOME=/app/models
      - LLM_MODE=${LLM_MODE:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6}
      # Empty means OpenAI itself; set it to redirect this path at Groq,
      # OpenRouter, DeepSeek, or any other chat-completions-compatible provider.
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Groq only: parsed, raw, or hidden. Empty for every other provider.
      - OPENAI_REASONING_FORMAT=${OPENAI_REASONING_FORMAT:-}
      # Floor for a request's output budget; reasoning models spend it first.
      - OPENAI_MIN_MAX_TOKENS=${OPENAI_MIN_MAX_TOKENS:-2048}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-5}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - ENABLE_YT_TRANSCRIPTION=true
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_URL_DOWNLOAD_MB=${MAX_URL_DOWNLOAD_MB:-10}
      - MAX_URL_REDIRECTS=${MAX_URL_REDIRECTS:-5}
      - URL_CONNECT_TIMEOUT_SECONDS=${URL_CONNECT_TIMEOUT_SECONDS:-5}
      - URL_READ_TIMEOUT_SECONDS=${URL_READ_TIMEOUT_SECONDS:-30}
      - URL_DOWNLOAD_TIMEOUT_SECONDS=${URL_DOWNLOAD_TIMEOUT_SECONDS:-30}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_PERIOD=${RATE_LIMIT_PERIOD:-60}
      - RATE_LIMIT_MAX_KEYS=${RATE_LIMIT_MAX_KEYS:-10000}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - ALLOW_PUBLIC_REGISTRATION=${ALLOW_PUBLIC_REGISTRATION:-false}
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=50
      - RETRIEVAL_TOP_K=5
      - RERANK_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./uploads:/app/uploads
    networks:
      - opennotebook
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opennotebook-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - opennotebook
    restart: unless-stopped

  # Optional: Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: opennotebook-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./models/ollama:/root/.ollama
    networks:
      - opennotebook
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - with-ollama

  # Optional: Redis for caching (future enhancement)
  redis:
    image: redis:7-alpine
    container_name: opennotebook-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - opennotebook
    restart: unless-stopped
    profiles:
      - with-cache

networks:
  opennotebook:
    driver: bridge

volumes:
  data:
  models:
  uploads:
