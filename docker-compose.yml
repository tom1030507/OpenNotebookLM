services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opennotebook-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_PORT: 8000
      DEBUG: ${DEBUG:-false}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DB_PATH: /app/data/opennotebook.db
      DATABASE_URL: sqlite:////app/data/opennotebook.db
      INGESTION_WORKER_CONCURRENCY: "${INGESTION_WORKER_CONCURRENCY:-1}"
      EMB_BACKEND: sqlitevec
      EMB_MODEL_NAME: ${EMB_MODEL_NAME:-intfloat/multilingual-e5-base}
      EMB_DIMENSION: ${EMB_DIMENSION:-768}
      # sentence-transformers caches downloaded models under $HOME/.cache/torch,
      # which lives in the container's writable layer — recreating the container
      # would re-download gigabytes. Point it at the mounted models volume.
      SENTENCE_TRANSFORMERS_HOME: /app/models
      HF_HOME: /app/models
      LLM_MODE: ${LLM_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      # Empty means OpenAI itself; set it to redirect this path at Groq,
      # OpenRouter, DeepSeek, or any other chat-completions-compatible provider.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Groq only: parsed, raw, or hidden. Empty for every other provider.
      OPENAI_REASONING_FORMAT: ${OPENAI_REASONING_FORMAT:-}
      # Floor for a request's output budget; reasoning models spend it first.
      OPENAI_MIN_MAX_TOKENS: ${OPENAI_MIN_MAX_TOKENS:-2048}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ENABLE_YT_TRANSCRIPTION: "true"
      YT_WHISPER_FALLBACK_ENABLED: "${YT_WHISPER_FALLBACK_ENABLED:-true}"
      YT_WHISPER_MODEL: ${YT_WHISPER_MODEL:-base}
      YT_MAX_DURATION_SECONDS: "${YT_MAX_DURATION_SECONDS:-1800}"
      YT_WHISPER_CACHE_DIR: ${YT_WHISPER_CACHE_DIR:-/app/models/whisper}
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-50}"
      MAX_URL_DOWNLOAD_MB: "${MAX_URL_DOWNLOAD_MB:-10}"
      MAX_URL_REDIRECTS: "${MAX_URL_REDIRECTS:-5}"
      URL_CONNECT_TIMEOUT_SECONDS: "${URL_CONNECT_TIMEOUT_SECONDS:-5}"
      URL_READ_TIMEOUT_SECONDS: "${URL_READ_TIMEOUT_SECONDS:-30}"
      URL_DOWNLOAD_TIMEOUT_SECONDS: "${URL_DOWNLOAD_TIMEOUT_SECONDS:-30}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-100}"
      RATE_LIMIT_PERIOD: "${RATE_LIMIT_PERIOD:-60}"
      RATE_LIMIT_MAX_KEYS: "${RATE_LIMIT_MAX_KEYS:-10000}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      ALLOW_PUBLIC_REGISTRATION: "${ALLOW_PUBLIC_REGISTRATION:-false}"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-opennotebooklm}
      CACHE_MAX_ENTRIES: "${CACHE_MAX_ENTRIES:-10000}"
      CHUNK_SIZE: "${CHUNK_SIZE:-512}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-50}"
      MAX_CHUNKS_PER_DOC: "${MAX_CHUNKS_PER_DOC:-1000}"
      RETRIEVAL_TOP_K: 5
      RERANK_ENABLED: "true"
    volumes:
      - data:/app/data
      - models:/app/models
      - uploads:/app/uploads
    networks:
      - opennotebook
    depends_on:
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      # A first-run model download/load can delay the HTTP listener for over 90s.
      # Keep those expected connection failures inside the startup grace window.
      start_period: 10m
      start_interval: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    container_name: opennotebook-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opennotebook
    restart: unless-stopped

  # Optional: Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: opennotebook-ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - opennotebook
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - with-ollama

  # Optional: Redis for a cache shared across backend processes.
  redis:
    image: redis:7-alpine
    container_name: opennotebook-redis
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - opennotebook
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles:
      - with-cache

networks:
  opennotebook:
    driver: bridge

volumes:
  data:
    name: opennotebooklm-data
  models:
    name: opennotebooklm-models
  uploads:
    name: opennotebooklm-uploads
  ollama_models:
    name: opennotebooklm-ollama-models
